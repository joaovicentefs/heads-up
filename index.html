<meta name="mobile-web-app-capable" content="yes"/>
<title>Adivinha!</title>

<style>
:root{--bg:#0f0c29;--bg2:#302b63;--bg3:#24243e;--green:#0a8f53;--red:#c0392b;--accent1:#FF6B6B;--accent2:#FFE66D;--accent3:#4ECDC4}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;width:100%;background:var(--bg)}
body{height:100%;width:100%;overflow:hidden;font-family:'Nunito',sans-serif;color:#fff;background:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
.screen{display:none;height:100%;width:100%;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}

/* HOME */
.home-bg{background:linear-gradient(135deg,var(--bg),var(--bg2),var(--bg3));padding:1.5rem 1rem 3rem}
.logo{font-size:clamp(2.5rem,8vw,4rem);font-weight:900;letter-spacing:-2px;text-transform:uppercase;background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:1rem}
.subtitle{font-size:.8rem;opacity:.5;letter-spacing:3px;text-transform:uppercase;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.65rem;width:100%;max-width:420px;padding-bottom:1rem}
.cat-card{border-radius:16px;padding:1rem .75rem;display:flex;flex-direction:column;align-items:center;gap:.35rem;cursor:pointer;transition:all .2s}
.cat-card:active{transform:scale(.94)!important}
.cat-card .icon{font-size:2rem}
.cat-card .name{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.cat-card .count{font-size:.65rem;opacity:.45}

/* READY */
.ready-bg{justify-content:center;padding:2rem;text-align:center}
.ready-phone{font-size:5rem;margin-bottom:1.5rem;animation:tilt 2s ease-in-out infinite}
.ready-title{font-size:1.75rem;font-weight:800;margin-bottom:1rem}
.ready-info{font-size:.95rem;opacity:.85;line-height:1.8;max-width:320px;margin-bottom:2rem;white-space:pre-line}
.btn-start{background:#fff;color:#1a1a2e;border:none;border-radius:50px;padding:1rem 3rem;font-size:1.25rem;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:2px;font-family:inherit}
.btn-start:active{transform:scale(.93)}

/* PLAYING */
.play-bg{justify-content:center;position:relative;transition:background .3s;overflow:hidden}
.hud-score{position:absolute;top:1rem;left:1.5rem;font-size:1rem;font-weight:700;opacity:.7}
.hud-timer{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);font-size:clamp(2rem,8vw,3.5rem);font-weight:900;opacity:.9;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.4);z-index:5}
.hud-timer.warn{color:#FF6B6B;animation:pulse .5s ease infinite alternate;text-shadow:0 0 20px rgba(255,107,107,.6)}
.hud-timer.critical{color:#ff4444;animation:pulse .35s ease infinite alternate;text-shadow:0 0 30px rgba(255,68,68,.8)}
@keyframes screenShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.play-bg.shake{animation:screenShake .3s ease}
.word{font-size:clamp(2.5rem,12vw,5rem);font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,.3);padding:0 2rem;line-height:1.1}
.fb-text{position:absolute;bottom:18%;font-size:1.5rem;font-weight:800;text-transform:uppercase;letter-spacing:4px;opacity:.9}
.btn-row{position:absolute;bottom:2rem;display:flex;gap:1.5rem;width:100%;justify-content:center;padding:0 1rem}
.btn-action{flex:1;max-width:180px;padding:1rem;border:none;border-radius:16px;font-size:1.1rem;font-weight:800;color:#fff;cursor:pointer;text-transform:uppercase;box-shadow:0 4px 15px rgba(0,0,0,.2);font-family:inherit}
.btn-action:active{transform:scale(.93)}
.btn-skip{background:rgba(231,76,60,.85)}
.btn-ok{background:rgba(39,174,96,.85)}

/* RESULT */
.result-bg{background:linear-gradient(135deg,var(--bg),var(--bg2),var(--bg3));padding:2rem 1rem}
.result-title{font-size:2rem;font-weight:900;margin-top:1rem;text-transform:uppercase;letter-spacing:-1px}
.result-score{font-size:4rem;font-weight:900;background:linear-gradient(135deg,var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:.25rem 0}
.result-sub{font-size:.85rem;opacity:.5;margin-bottom:1.25rem}
.result-list{width:100%;max-width:400px;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.5rem;max-height:45dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:.25rem}
.result-item{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-radius:12px}
.result-item.ok{background:rgba(78,205,196,.15);border:1px solid rgba(78,205,196,.3)}
.result-item.fail{background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.3)}
.result-item .rw{font-size:.95rem;font-weight:600}
.result-item .ri{font-size:1.2rem}
.ri.ok{color:#4ECDC4}
.ri.fail{color:#FF6B6B}
.btn-again{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#1a1a2e;border:none;border-radius:50px;padding:1rem 2.5rem;font-size:1.1rem;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:2px;margin-bottom:.75rem;font-family:inherit}
.btn-home{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.2);border-radius:50px;padding:.75rem 2rem;font-size:.9rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:2px;font-family:inherit}
.btn-again:active,.btn-home:active{transform:scale(.93)}

/* TIME PICKER */
.time-picker{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem}
.time-chip{padding:.5rem 1.1rem;border-radius:50px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.time-chip:active{transform:scale(.93)}
.time-chip.active{background:#fff;color:#1a1a2e;border-color:#fff}

/* QUIT BUTTON */
.btn-quit{position:absolute;top:1rem;right:1rem;transform:none;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.25);border-radius:50px;padding:.4rem 1.2rem;font-size:.75rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;font-family:inherit;z-index:10;transition:opacity .2s}
.btn-quit:active{transform:scale(.93)}

/* MODE TOGGLE */
.mode-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:50px;padding:3px;margin-bottom:1.25rem;gap:3px}
.mode-btn{flex:1;padding:.45rem 1rem;border:none;border-radius:50px;background:transparent;color:rgba(255,255,255,.6);font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .25s;text-transform:uppercase;letter-spacing:1px}
.mode-btn.active{background:#fff;color:#1a1a2e;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mode-btn:active{transform:scale(.95)}

/* HELP LINK */
.link-help{color:rgba(255,255,255,.5);font-size:.85rem;font-weight:700;text-decoration:none;letter-spacing:1px;padding:.75rem 0;transition:color .2s}
.link-help:active{color:rgba(255,255,255,.8)}
</style>
</head>
<body>

<div class="screen home-bg active" id="homeScreen">
  <div class="logo">Adivinha!</div>
  <div class="subtitle" id="subtitle">Jogo de Adivinhação</div>
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active" onclick="setMode(false)">Adulto</button>
    <button class="mode-btn" onclick="setMode(true)">Jovens ⭐</button>
  </div>
  <div class="grid" id="catGrid"></div>
  <a href="instrucoes.html" class="link-help">Como Jogar?</a>
</div>

<div class="screen ready-bg" id="readyScreen">
  <div class="ready-phone">📱</div>
  <div class="ready-title" id="readyTitle"></div>
  <div class="ready-info" id="readyInfo"></div>
  <div class="time-picker" id="timePicker"></div>
  <button class="btn-start" onclick="beginPlaying()">Começar!</button>
</div>

<div class="screen play-bg" id="playScreen">
  <button class="btn-quit" id="btnQuit" onclick="quitGame()">Encerrar</button>
  <div class="hud-score" id="hudScore">✅ 0  ❌ 0</div>
  <div class="hud-timer" id="hudTimer">60s</div>
  <div class="word" id="wordDisplay"></div>
  <div class="fb-text" id="fbText" style="display:none"></div>
  <div class="btn-row" id="btnRow" style="display:none">
    <button class="btn-action btn-skip" onclick="doAnswer(false)">❌ Passar</button>
    <button class="btn-action btn-ok" onclick="doAnswer(true)">✅ Acertou</button>
  </div>
</div>

<div class="screen result-bg" id="resultScreen">
  <div class="result-title">Fim de Jogo!</div>
  <div class="result-score" id="resScore">0</div>
  <div class="result-sub" id="resSub"></div>
  <div class="result-list" id="resList"></div>
  <button class="btn-again" onclick="replayCategory()">Jogar Novamente</button>
  <button class="btn-home" onclick="showScreen('home')">Categorias</button>
</div>

var jovensMode=localStorage.getItem('jovensMode')==='true';

function getCats(){return jovensMode?CATS_JOVENS:CATS}

function setMode(isJovens){
  jovensMode=isJovens;
  localStorage.setItem('jovensMode',jovensMode?'true':'false');
  applyMode();
  buildGrid();
}

function applyMode(){
  var r=document.documentElement.style;
  var btns=$('modeToggle').querySelectorAll('.mode-btn');
  var sub=$('subtitle');
  if(jovensMode){
    r.setProperty('--bg','#0b0b3b');
    r.setProperty('--bg2','#1a1a6e');
    r.setProperty('--bg3','#2d2b7c');
    btns[0].classList.remove('active');
    btns[1].classList.add('active');
    sub.textContent='Modo Jovens ⭐';
  }else{
    r.setProperty('--bg','#0f0c29');
    r.setProperty('--bg2','#302b63');
    r.setProperty('--bg3','#24243e');
    btns[0].classList.add('active');
    btns[1].classList.remove('active');
    sub.textContent='Jogo de Adivinhação';
  }
}

var TIME_OPTIONS=[30,60,90,120,0];
var state={scr:"home",cat:null,words:[],idx:0,time:60,roundTime:60,results:[],fb:null};
var tickId=null,fbId=null,lastAct=0,wakeLock=null;

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function $(id){return document.getElementById(id)}

function showScreen(name){
  state.scr=name;
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active")});
  $(name+"Screen").classList.add("active");
}

function buildGrid(){
  var g=$("catGrid");g.innerHTML="";
  var cats=getCats();
  var keys=Object.keys(cats);
  keys.forEach(function(k,i){
    var c=cats[k];
    var d=document.createElement("div");
    d.className="cat-card";
    d.style.background="linear-gradient(145deg,"+c.color+"15,"+c.color+"35)";
    d.style.border="2px solid "+c.color+"55";
    d.style.animation="fadeUp 0.4s ease "+i*0.06+"s both";
    d.onclick=function(){startGame(k)};
    d.innerHTML='<span class="icon">'+c.icon+'</span><span class="name">'+k+'</span><span class="count">'+c.words.length+" palavras"+'</span>';
    g.appendChild(d);
  });
}

function startGame(k){
  state.cat=k;state.idx=0;state.time=state.roundTime;state.results=[];state.fb=null;
  state.words=shuffle(getCats()[k].words);
  renderReady();
  showScreen("ready");
}

function renderReady(){
  var c=getCats()[state.cat];
  $("readyScreen").style.background="linear-gradient(135deg,"+c.color+"dd,"+c.color+")";
  $("readyTitle").textContent=c.icon+" "+state.cat.toUpperCase();
  var info="Use os botões para acertar ou passar.\n\n";
  if(state.roundTime===0)info+="Modo sem limite de tempo!";
  else info+="Você tem "+state.roundTime+"s!";
  $("readyInfo").textContent=info;
  renderTimePicker();
}

function renderTimePicker(){
  var tp=$("timePicker");tp.innerHTML="";
  TIME_OPTIONS.forEach(function(t){
    var b=document.createElement("button");
    b.className="time-chip"+(state.roundTime===t?" active":"");
    b.textContent=t===0?"∞":t+"s";
    b.onclick=function(){state.roundTime=t;state.time=t;renderReady()};
    tp.appendChild(b);
  });
}

function beginPlaying(){
  showScreen("play");
  $("btnRow").style.display="flex";
  requestWakeLock();
  renderPlay();
  if(state.roundTime!==0)startTimer();
  else renderTimer();
}

function startTimer(){
  clearInterval(tickId);
  if(state.roundTime===0)return;
  tickId=setInterval(function(){
    state.time--;
    renderTimer();
    if(state.time<=0){clearInterval(tickId);vib([200,100,200,100,200]);endGame()}
    else if(state.time===10)vib(100);
  },1000);
}

function renderTimer(){
  var el=$("hudTimer");
  var ps=$("playScreen");
  if(state.roundTime===0){el.textContent="∞";el.className="hud-timer";return}
  el.textContent=state.time+"s";
  if(state.time<=5){el.className="hud-timer critical";ps.classList.remove('shake');void ps.offsetWidth;ps.classList.add('shake');vib(80)}
  else if(state.time<=10){el.className="hud-timer warn";if(state.time<=8)vib(40)}
  else{el.className="hud-timer"}
}

function renderPlay(){
  if(state.fb==="ok"){$("wordDisplay").textContent="✅";$("fbText").textContent="Acertou!";$("fbText").style.display="block"}
  else if(state.fb==="skip"){$("wordDisplay").textContent="❌";$("fbText").textContent="Passou!";$("fbText").style.display="block"}
  else{$("wordDisplay").textContent=state.words[state.idx]||"";$("fbText").style.display="none"}
  $("hudScore").textContent="✅ "+state.results.filter(function(r){return r.ok}).length+"  ❌ "+state.results.filter(function(r){return!r.ok}).length;
  var cc=getCats()[state.cat];$("playScreen").style.background=state.fb==="ok"?"#0a8f53":state.fb==="skip"?"#c0392b":(cc?cc.color:"#302b63");
  $("btnRow").style.display=state.fb?"none":"flex";
}

function doAnswer(ok){
  var now=Date.now();
  if(now-lastAct<800)return;
  lastAct=now;
  vib(ok?[50]:[30,50,30]);
  state.fb=ok?"ok":"skip";
  state.results.push({word:state.words[state.idx],ok:ok});
  renderPlay();
  clearTimeout(fbId);
  fbId=setTimeout(function(){
    state.fb=null;
    if(state.idx+1>=state.words.length){clearInterval(tickId);endGame()}
    else{state.idx++;renderPlay()}
  },600);
}

function endGame(){
  clearInterval(tickId);
  releaseWakeLock();
  var ok=state.results.filter(function(r){return r.ok}).length;
  var skip=state.results.filter(function(r){return!r.ok}).length;
  $("resScore").textContent=ok;
  $("resSub").textContent=ok+" acerto"+(ok!==1?"s":"")+" · "+skip+" passou · "+state.results.length+" total";
  var list=$("resList");list.innerHTML="";
  state.results.forEach(function(r,i){
    var d=document.createElement("div");
    d.className="result-item "+(r.ok?"ok":"fail");
    d.style.animation="fadeUp 0.3s ease "+i*0.04+"s both";
    d.innerHTML='<span class="rw">'+r.word+'</span><span class="ri '+(r.ok?"ok":"fail")+'">'+(r.ok?"✓":"✗")+'</span>';
    list.appendChild(d);
  });
  showScreen("result");
}

function replayCategory(){startGame(state.cat)}

function quitGame(){clearInterval(tickId);vib([200,100,200]);endGame()}

function requestWakeLock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wakeLock=l})}catch(e){}}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}

applyMode();
buildGrid();
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js')}
</script>
